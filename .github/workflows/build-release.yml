name: Build and Release Firmware

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update"
        required: false
        default: "v2.1.2.8"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware (STM32G0B1RE_btt)
        run: pio run -e STM32G0B1RE_btt

      - name: Resolve release tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Marlin 2.1.2.8 – Ender 3 / BTT SKR Mini E3 V3.0 / BLTouch"
          body_path: .github/RELEASE_TEMPLATE.md
          files: .pio/build/STM32G0B1RE_btt/firmware.bin
